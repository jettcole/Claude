name: Tallyroll

options:
  bundleIdPrefix: com.tallyroll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  Tallyroll:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: Tallyroll
        PRODUCT_BUNDLE_IDENTIFIER: com.tallyroll.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tallyroll
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Tallyroll uses the camera so an item can carry a photo of itself on the Sell screen."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Tallyroll can use a picture from your photo library as an item's photo."

  TallyrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Tallyroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tallyroll.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Tallyroll:
    build:
      targets:
        Tallyroll: all
        TallyrollTests: [test]
    test:
      targets:
        - TallyrollTests
